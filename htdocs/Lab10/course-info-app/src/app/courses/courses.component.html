    <h2>My Course List</h2>
    <ul class="courses">
      <li
        *ngFor="let c of courses"
        (click)="onSelect(c)"
        [class.selected]="c === selectedCourse"
      >
        <span class="badge">{{ c.course_id }}</span> {{ c.course_title }}
        <span class="text">{{ c.course_title }}</span>
      </li>
    </ul>
    <app-course-detail [course]="selectedCourse"></app-course-detail>
