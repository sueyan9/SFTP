<!DOCTYPE html>
<html>
<head>
    <title>Lab 08</title>
</head>
<body>
    <h2>Question a: Running Total</h2>
    <script>
        let total = 0;
        for(let i = 1; i <= 10; i++) {
            total += i;
            document.write("The total at " + i + " is: " + total + "<br>");
        }
    </script>
</body>
</html>
